name: CI

# Runs the unit tests and a debug build on every push to main and on every pull request. Uses NO secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon
